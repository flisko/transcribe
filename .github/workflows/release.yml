  #       - name: Compute release version
  #         run: echo "RELEASE_VERSION=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"
  #         shell: bash
  #       - ... build the Windows app ...
  #       - ... zip it as Transcribe-windows-v${RELEASE_VERSION}.zip ...
  #       - name: Attach to the release
  #         env:
  #           GH_TOKEN: ${{ github.token }}
  #         run: gh release upload "v${RELEASE_VERSION}" "Transcribe-windows-v${RELEASE_VERSION}.zip"
  #         shell: bash
  #
  # Keep per-platform asset names (Transcribe-<platform>-vX.Y.Z.zip). The
  # in-app update check needs no changes for this: each platform ships its own
  # binary, so every platform's banner points at the same release page and
  # users download the zip for their machine. See docs/RELEASING.md.
  # --------------------------------------------------------------------------
