# Builds and publishes a macOS + Windows release on every push to main.
# See docs/RELEASING.md for how versioning works and how the in-app update
# banner connects to these releases.
#
# The build-win job runs a genuine smoke (the real setup.ps1 tool download, then
# the engine integration tests against those binaries) before packaging, so a
# broken Windows build fails the release instead of shipping. It is the ongoing
# regression net for the Windows port; WINDOWS-TASKS.md records what was proven
# on real hardware and what CI still can't see (models, toasts, SmartScreen).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two rapid pushes must release one after the other, never interleaved —
# racing runs could otherwise fight over tags and "latest".
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # creating the tag + release needs write access

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Patch number = workflow run number, so every push to main gets a
      # unique, increasing version: VERSION=1.0 + run 42 -> v1.0.42.
      # (tr strips any stray whitespace/CRLF the VERSION file might carry.)
      - name: Compute release version
        run: echo "RELEASE_VERSION=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Unit tests
        working-directory: desktop
        run: npm test

      # extraMetadata bakes the version and the update-check repo slug into
      # the packaged package.json — local builds get neither, which keeps
      # their update banner off. --universal preserves the 2.0 promise:
      # one app for Apple Silicon + Intel.
      - name: Build Transcribe.app
        working-directory: desktop
        env:
          TRANSCRIBE_UPDATE_REPO: ${{ github.repository }}
        run: |
          npx electron-builder --mac --universal \
            -c.extraMetadata.version="$RELEASE_VERSION" \
            -c.extraMetadata.updateRepo="$TRANSCRIBE_UPDATE_REPO"

      # The zip holds the same folder users copy between Macs: app + engine
      # scripts + setup + README. Models are NEVER shipped (4.6GB) —
      # setup.command downloads them on the user's Mac. ditto (not zip)
      # preserves the .app bundle structure and permission bits.
      - name: Stage and zip the release folder
        run: |
          mkdir -p stage/Transcribe
          ditto desktop/dist/mac-universal/Transcribe.app stage/Transcribe/Transcribe.app
          ditto bin stage/Transcribe/bin
          cp setup.command README.md stage/Transcribe/
          ditto -c -k --keepParent stage/Transcribe "Transcribe-macos-v${RELEASE_VERSION}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: mac-zip
          path: Transcribe-macos-v*.zip
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Compute release version
        shell: bash
        run: echo "RELEASE_VERSION=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Unit tests
        working-directory: desktop
        run: npm test

      # REAL smoke, part 1: the same setup users run, minus the ~4.6GB models
      # — proves the tool downloads (whisper/ffmpeg/yt-dlp/deno) and the
      # script itself work on a clean Windows machine.
      - name: Smoke - setup.ps1 downloads the Windows tools
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -ToolsOnly
          foreach ($t in 'whisper\whisper-cli.exe','ffmpeg\ffmpeg.exe','yt-dlp\yt-dlp.exe','deno\deno.exe') {
            if (-not (Test-Path "tools\win\$t")) { throw "missing tool after setup: $t" }
          }

      # REAL smoke, part 2: engine integration tests against the tools that
      # setup.ps1 just installed (yt-dlp dlInfo hits a real URL). Tests that
      # need the speech models self-skip — models are never downloaded in CI.
      - name: Smoke - engine tests against real tools
        working-directory: desktop
        env:
          TRANSCRIBE_ROOT: ${{ github.workspace }}
        run: npm run test:integration

      - name: Build Transcribe.exe
        working-directory: desktop
        env:
          TRANSCRIBE_UPDATE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          npx electron-builder --win \
            -c.extraMetadata.version="$RELEASE_VERSION" \
            -c.extraMetadata.updateRepo="$TRANSCRIBE_UPDATE_REPO"

      # Windows layout: Transcribe.exe + resources at the folder top (the
      # win-unpacked contents), setup beside them. Models NEVER shipped —
      # "Transcribe Setup.bat" downloads them on the user's machine.
      - name: Stage and zip the release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/Transcribe | Out-Null
          Copy-Item -Recurse desktop/dist/win-unpacked/* stage/Transcribe/
          Copy-Item 'Transcribe Setup.bat', 'setup.ps1', 'README.md' stage/Transcribe/
          Compress-Archive -Path stage/Transcribe -DestinationPath "Transcribe-windows-v$env:RELEASE_VERSION.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: win-zip
          path: Transcribe-windows-v*.zip
          if-no-files-found: error

  # Creates tag v<version> AND the release with BOTH zips in one step. The
  # app's update check reads releases/latest, so publishing here is what makes
  # every older app show its "new version available" banner. --target pins the
  # tag to the exact commit these zips were built from — without it, gh tags
  # whatever main's HEAD is by release time, which can be a newer push.
  release:
    runs-on: ubuntu-latest
    needs: [build-mac, build-win]
    steps:
      - uses: actions/checkout@v7

      - name: Compute release version
        run: echo "RELEASE_VERSION=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # Neither build is code-signed, so the OS can tell a user nothing about
      # where a zip came from — and the repo is public, so anyone can fork it and
      # let this same workflow publish a "Transcribe" release under their own
      # account. A SHA-256 published here, next to the artifacts this run
      # produced, is the one thing a careful user can check a download against.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAC="Transcribe-macos-v${RELEASE_VERSION}.zip"
          WIN="Transcribe-windows-v${RELEASE_VERSION}.zip"
          {
            echo '### Verify your download'
            echo
            echo 'These builds are not code-signed, so macOS and Windows will warn on first run.'
            echo 'The only official source is <https://github.com/flisko/transcribe/releases>.'
            echo 'Check the file you downloaded against the SHA-256 below —'
            echo '`shasum -a 256 <file>` on macOS, `Get-FileHash <file>` on Windows.'
            echo
            echo '```'
            sha256sum "$MAC" "$WIN"
            echo '```'
          } > release-notes.md
          gh release create "v${RELEASE_VERSION}" "$MAC" "$WIN" \
            --target "$GITHUB_SHA" \
            --title "Transcribe v${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            --generate-notes
