# Builds and publishes a macOS + Windows release on every push to main.
# See docs/RELEASING.md for how versioning works and how the in-app update
# banner connects to these releases.
#
# The build-win job runs a genuine smoke (the real setup.ps1 tool download, then
# the engine integration tests against those binaries) before packaging, so a
# broken Windows build fails the release instead of shipping. It is the ongoing
# regression net for the Windows port; WINDOWS-TASKS.md records what was proven
# on real hardware and what CI still can't see (models, toasts, SmartScreen).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two rapid pushes must release one after the other, never interleaved —
# racing runs could otherwise fight over tags and "latest".
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # creating the tag + release needs write access

jobs:
  build-mac:
    runs-on: macos-latest
    # Read by the release job so the notes describe what was actually produced
    # rather than what the workflow hoped for.
    outputs:
      signed: ${{ steps.cred.outputs.sign }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Patch number = workflow run number, so every push to main gets a
      # unique, increasing version: VERSION=1.0 + run 42 -> v1.0.42.
      # (tr strips any stray whitespace/CRLF the VERSION file might carry.)
      - name: Compute release version
        run: echo "RELEASE_VERSION=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Unit tests
        working-directory: desktop
        run: npm test

      # Signing and notarization are OPTIONAL, and deliberately so: every push to
      # main publishes, so a hard failure on a missing or expired credential
      # would mean no release at all. Absent secrets => the old unsigned build.
      # The `secrets` context is not available in a step-level `if`, so presence
      # has to become an output first.
      - name: Detect signing credentials
        id: cred
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$KEY" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing credentials — publishing an UNSIGNED macOS build."
          fi

      # A throwaway keychain, not the login one: it is unlocked with a password
      # that lives only in this job, and the runner is destroyed afterwards.
      - name: Import Developer ID certificate
        if: steps.cred.outputs.sign == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a GUI "allow access" prompt no one
          # is there to answer, and the build hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"

      - name: Stage the App Store Connect API key
        if: steps.cred.outputs.sign == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # extraMetadata bakes the version and the update-check repo slug into
      # the packaged package.json — local builds get neither, which keeps
      # their update banner off. --universal preserves the 2.0 promise:
      # one app for Apple Silicon + Intel.
      - name: Build Transcribe.app
        working-directory: desktop
        env:
          TRANSCRIBE_UPDATE_REPO: ${{ github.repository }}
          # notarytool credentials, read by electron-builder when notarize is on.
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Off => electron-builder skips signing instead of erroring on a
          # keychain with no Developer ID in it.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.cred.outputs.sign }}
        run: |
          # Notarization is the only signing knob passed on the CLI: it has no
          # sane unsigned default, while identity/entitlements are settled by
          # electron-builder.yml plus the keychain.
          NOTARIZE=""
          if [ "${{ steps.cred.outputs.sign }}" = "true" ]; then NOTARIZE="-c.mac.notarize=true"; fi
          npx electron-builder --mac --universal $NOTARIZE \
            -c.extraMetadata.version="$RELEASE_VERSION" \
            -c.extraMetadata.updateRepo="$TRANSCRIBE_UPDATE_REPO"

      # Proves what actually shipped rather than what was configured. A stapled
      # ticket is what lets a client's Mac approve the app while OFFLINE; without
      # the staple, Gatekeeper has to reach Apple on first launch.
      - name: Verify signature and notarization
        if: steps.cred.outputs.sign == 'true'
        run: |
          APP=desktop/dist/mac-universal/Transcribe.app
          # Fatal: a broken signature is worse than shipping unsigned, because
          # the user gets "the app is damaged" with no way forward.
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vvv -t exec "$APP"
          # electron-builder staples after a successful notarization; this is a
          # belt-and-braces retry for the case where it didn't. Advisory only —
          # an unstapled but notarized app still passes Gatekeeper, it just has
          # to ask Apple over the network on first launch instead of offline.
          xcrun stapler staple "$APP" || true
          xcrun stapler validate "$APP" \
            || echo "::warning::Not stapled — first launch will need a network round-trip to Apple."

      # The zip holds the same folder users copy between Macs: app + engine
      # scripts + setup + README. Models are NEVER shipped (4.6GB) —
      # setup.command downloads them on the user's Mac. ditto (not zip)
      # preserves the .app bundle structure and permission bits.
      - name: Stage and zip the release folder
        run: |
          mkdir -p stage/Transcribe
          ditto desktop/dist/mac-universal/Transcribe.app stage/Transcribe/Transcribe.app
          ditto bin stage/Transcribe/bin
          cp setup.command README.md stage/Transcribe/
          ditto -c -k --keepParent stage/Transcribe "Transcribe-macos-v${RELEASE_VERSION}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: mac-zip
          path: Transcribe-macos-v*.zip
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Compute release version
        shell: bash
        run: echo "RELEASE_VERSION=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Unit tests
        working-directory: desktop
        run: npm test

      # REAL smoke, part 1: the same setup users run, minus the ~4.6GB models
      # — proves the tool downloads (whisper/ffmpeg/yt-dlp/deno) and the
      # script itself work on a clean Windows machine.
      - name: Smoke - setup.ps1 downloads the Windows tools
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -ToolsOnly
          foreach ($t in 'whisper\whisper-cli.exe','ffmpeg\ffmpeg.exe','yt-dlp\yt-dlp.exe','deno\deno.exe') {
            if (-not (Test-Path "tools\win\$t")) { throw "missing tool after setup: $t" }
          }

      # REAL smoke, part 2: engine integration tests against the tools that
      # setup.ps1 just installed (yt-dlp dlInfo hits a real URL). Tests that
      # need the speech models self-skip — models are never downloaded in CI.
      - name: Smoke - engine tests against real tools
        working-directory: desktop
        env:
          TRANSCRIBE_ROOT: ${{ github.workspace }}
        run: npm run test:integration

      - name: Build Transcribe.exe
        working-directory: desktop
        env:
          TRANSCRIBE_UPDATE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          npx electron-builder --win \
            -c.extraMetadata.version="$RELEASE_VERSION" \
            -c.extraMetadata.updateRepo="$TRANSCRIBE_UPDATE_REPO"

      # Windows layout: Transcribe.exe + resources at the folder top (the
      # win-unpacked contents), setup beside them. Models NEVER shipped —
      # "Transcribe Setup.bat" downloads them on the user's machine.
      - name: Stage and zip the release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/Transcribe | Out-Null
          Copy-Item -Recurse desktop/dist/win-unpacked/* stage/Transcribe/
          Copy-Item 'Transcribe Setup.bat', 'setup.ps1', 'README.md' stage/Transcribe/
          Compress-Archive -Path stage/Transcribe -DestinationPath "Transcribe-windows-v$env:RELEASE_VERSION.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: win-zip
          path: Transcribe-windows-v*.zip
          if-no-files-found: error

  # Creates tag v<version> AND the release with BOTH zips in one step. The
  # app's update check reads releases/latest, so publishing here is what makes
  # every older app show its "new version available" banner. --target pins the
  # tag to the exact commit these zips were built from — without it, gh tags
  # whatever main's HEAD is by release time, which can be a newer push.
  release:
    runs-on: ubuntu-latest
    needs: [build-mac, build-win]
    steps:
      - uses: actions/checkout@v7

      - name: Compute release version
        run: echo "RELEASE_VERSION=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # Neither build is code-signed, so the OS can tell a user nothing about
      # where a zip came from — and the repo is public, so anyone can fork it and
      # let this same workflow publish a "Transcribe" release under their own
      # account. A SHA-256 published here, next to the artifacts this run
      # produced, is the one thing a careful user can check a download against.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ needs.build-mac.outputs.signed }}
        run: |
          MAC="Transcribe-macos-v${RELEASE_VERSION}.zip"
          WIN="Transcribe-windows-v${RELEASE_VERSION}.zip"
          {
            echo '### Verify your download'
            echo
            if [ "$MAC_SIGNED" = "true" ]; then
              echo 'The macOS build is signed with a Developer ID and notarized by Apple, so it opens'
              echo 'with a single "Open" prompt. The Windows build is not signed and SmartScreen will warn.'
            else
              echo 'These builds are not code-signed, so macOS and Windows will warn on first run.'
            fi
            echo 'The only official source is <https://github.com/flisko/transcribe/releases>.'
            echo 'Check the file you downloaded against the SHA-256 below —'
            echo '`shasum -a 256 <file>` on macOS, `Get-FileHash <file>` on Windows.'
            echo
            echo '```'
            sha256sum "$MAC" "$WIN"
            echo '```'
          } > release-notes.md
          gh release create "v${RELEASE_VERSION}" "$MAC" "$WIN" \
            --target "$GITHUB_SHA" \
            --title "Transcribe v${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            --generate-notes
