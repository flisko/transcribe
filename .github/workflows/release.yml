# Builds and publishes a macOS release on every push to main.
# Dormant until this project is pushed to a GitHub repo — see docs/RELEASING.md
# for how to activate it, how versioning works, and how the in-app update
# banner connects to these releases.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two rapid pushes must release one after the other, never interleaved —
# racing runs could otherwise fight over tags and "latest".
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # creating the tag + release needs write access

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Patch number = workflow run number, so every push to main gets a
      # unique, increasing version: VERSION=1.0 + run 42 -> v1.0.42.
      - name: Compute release version
        run: echo "RELEASE_VERSION=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build Transcribe.app
        run: ./build_app.sh --version "$RELEASE_VERSION" --update-repo "$GITHUB_REPOSITORY"

      # The zip holds the same folder users copy between Macs: app + engine
      # scripts + setup + README. Models are NEVER shipped (4.6GB) —
      # setup.command downloads them on the user's Mac. ditto (not zip)
      # preserves the .app bundle structure, signature, and permission bits.
      - name: Stage and zip the release folder
        run: |
          mkdir -p stage/Transcribe
          ditto Transcribe.app stage/Transcribe/Transcribe.app
          ditto bin stage/Transcribe/bin
          cp setup.command README.md stage/Transcribe/
          ditto -c -k --keepParent stage/Transcribe "Transcribe-macos-v${RELEASE_VERSION}.zip"

      # Creates tag v<version> AND the release in one step. The app's update
      # check reads releases/latest, so publishing here is what makes every
      # older app show its "new version available" banner. --target pins the
      # tag to the exact commit this zip was built from — without it, gh tags
      # whatever main's HEAD is by release time, which can be a newer push.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            "Transcribe-macos-v${RELEASE_VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "Transcribe v${RELEASE_VERSION}" \
            --generate-notes

  # --------------------------------------------------------------------------
  # FUTURE: the Windows build slots in here as a second job, e.g.:
  #
  #   windows:
  #     runs-on: windows-latest
