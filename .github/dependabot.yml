# Electron IS Chromium: every Electron release carries browser security fixes,
# and this app renders remote content (the Instagram login window) in it. The
# version is pinned in desktop/package-lock.json and baked into every release, so
# without an automated nudge the pin ages silently between releases — and on a
# public repo anyone can read the lockfile and tell exactly which Chromium a
# given release shipped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore

  # The workflows themselves pin actions by float tag (actions/checkout@v4).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: chore
